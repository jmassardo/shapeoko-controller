<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 376 348" width="1504" height="1392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f44"/>
      <stop offset="1" stop-color="#25292d"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7278"/>
      <stop offset="1" stop-color="#31363a"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d858c"/>
      <stop offset="1" stop-color="#2b2f33"/>
    </linearGradient>
    <radialGradient id="estop" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff5a4d"/>
      <stop offset="1" stop-color="#a5140b"/>
    </radialGradient>
    <radialGradient id="btnG" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#5ce08a"/><stop offset="1" stop-color="#158a41"/>
    </radialGradient>
    <radialGradient id="btnY" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffdc63"/><stop offset="1" stop-color="#b98800"/>
    </radialGradient>
    <radialGradient id="btnR" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff7b70"/><stop offset="1" stop-color="#a51d14"/>
    </radialGradient>
    <radialGradient id="btnB" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#7fc9ff"/><stop offset="1" stop-color="#1667a8"/>
    </radialGradient>
    <radialGradient id="btnW" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f2f5f7"/><stop offset="1" stop-color="#9aa4ac"/>
    </radialGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12202b"/><stop offset="1" stop-color="#0a151d"/>
    </linearGradient>
  </defs>
  <style>
    .lbl  { fill:#d7dde2; font-size:3.4px; letter-spacing:0.35px; text-anchor:middle; font-weight:600; }
    .sub  { fill:#8e979e; font-size:2.6px; text-anchor:middle; }
    .tick { stroke:#aeb6bc; stroke-width:0.4; }
    .dim  { stroke:#5aa9e6; stroke-width:0.35; fill:none; }
    .dimt { fill:#5aa9e6; font-size:3.6px; text-anchor:middle; font-weight:600; }
    .note { fill:#9aa3aa; font-size:3px; }
  </style>

  <!-- ============ PANEL BODY ============ -->
  <rect x="0" y="0" width="340" height="290" rx="7" fill="url(#panel)" stroke="#14181b" stroke-width="1.2"/>
  <rect x="3" y="3" width="334" height="284" rx="5" fill="none" stroke="#4c5359" stroke-width="0.5"/>
  <g fill="#1b1f22" stroke="#585f65" stroke-width="0.4">
    <circle cx="8" cy="282" r="2"/>
    <circle cx="332" cy="282" r="2"/>
    <circle cx="8" cy="8" r="2"/>
    <circle cx="332" cy="8" r="2"/>
  </g>

  <!-- ============ ZONE DIVIDERS ============ -->
  <line x1="12" y1="156" x2="328" y2="156" stroke="#4c5359" stroke-width="0.6"/>
  <text x="12" y="153" class="note" font-size="2.8">— JOG / PENDANT —</text>
  <line x1="12" y1="238" x2="328" y2="238" stroke="#4c5359" stroke-width="0.6"/>
  <text x="12" y="235" class="note" font-size="2.8">— MACHINE / AUX —</text>

  <!-- control: axis_select (rotary_selector) -->
  <g>
    <circle cx="152" cy="182" r="21" fill="none" stroke="#565d63" stroke-width="0.5"/>
    <circle cx="152" cy="182" r="15" fill="url(#knob)" stroke="#1e2226" stroke-width="0.9"/>
    <line x1="152" y1="182" x2="140" y2="176" class="tick" stroke-width="1.2"/>
    <g class="sub">
      <text x="131" y="176">OFF</text>
      <text x="137" y="163">X</text>
      <text x="152" y="159">Y</text>
      <text x="167" y="163">Z</text>
    </g>
    <text class="lbl" x="152" y="212">AXIS</text>
  </g>

  <!-- control: dsi_screen (dsi_screen) -->
  <g>
    <rect x="12" y="12" width="168" height="104" rx="2.5" fill="#0d1114" stroke="#585f65" stroke-width="0.6"/>
    <rect x="19" y="19" width="154" height="86" fill="url(#scr)"/>
        <rect x="19" y="19" width="154" height="10" fill="#16242f"/>
        <text x="22.5" y="26" fill="#cfe4f2" font-size="4">bracket_v3.nc</text>
        <circle cx="145" cy="24" r="2.2" fill="#35d07f"/>
        <text x="150" y="26" fill="#35d07f" font-size="4" font-weight="700">READY</text>
        <text x="23" y="41"  fill="#7f8f9b" font-size="4.6" font-weight="700">X</text>
        <text x="104" y="41" fill="#eaf4fb" font-size="7.6" font-weight="700" text-anchor="end" font-family="Menlo, monospace">-142.507</text>
        <text x="23" y="53"  fill="#7f8f9b" font-size="4.6" font-weight="700">Y</text>
        <text x="104" y="53" fill="#eaf4fb" font-size="7.6" font-weight="700" text-anchor="end" font-family="Menlo, monospace">  88.240</text>
        <text x="23" y="65"  fill="#7f8f9b" font-size="4.6" font-weight="700">Z</text>
        <text x="104" y="65" fill="#ffcf5a" font-size="7.6" font-weight="700" text-anchor="end" font-family="Menlo, monospace">  -3.015</text>
        <line x1="110" y1="33" x2="110" y2="70" stroke="#263a49" stroke-width="0.5"/>
        <text x="115" y="39" fill="#7f8f9b" font-size="3.2">FEED</text>
        <text x="169" y="39" fill="#eaf4fb" font-size="4.6" text-anchor="end" font-family="Menlo, monospace">1200</text>
        <text x="115" y="49" fill="#7f8f9b" font-size="3.2">SPINDLE</text>
        <text x="169" y="49" fill="#eaf4fb" font-size="4.6" text-anchor="end" font-family="Menlo, monospace">18000</text>
        <text x="115" y="59" fill="#7f8f9b" font-size="3.2">OVERRIDE</text>
        <text x="169" y="59" fill="#35d07f" font-size="4.6" text-anchor="end" font-family="Menlo, monospace">100%</text>
        <text x="115" y="69" fill="#7f8f9b" font-size="3.2">TOOL</text>
        <text x="169" y="69" fill="#eaf4fb" font-size="4.6" text-anchor="end" font-family="Menlo, monospace">#302</text>
        <rect x="23" y="75" width="146" height="5" rx="2.5" fill="#1d2c38"/>
        <rect x="23" y="75" width="94"  height="5" rx="2.5" fill="#35d07f"/>
        <text x="23" y="86" fill="#8fa3b2" font-size="3.2">64%  ·  12:41 elapsed  ·  ~7:02 remaining</text>
        <rect x="23"  y="91" width="34" height="11" rx="2" fill="#20313e" stroke="#345266" stroke-width="0.5"/>
        <text x="40" y="98.5" fill="#cfe4f2" font-size="3.8" text-anchor="middle">JOG</text>
        <rect x="60"  y="91" width="34" height="11" rx="2" fill="#20313e" stroke="#345266" stroke-width="0.5"/>
        <text x="77" y="98.5" fill="#cfe4f2" font-size="3.8" text-anchor="middle">PROBE</text>
        <rect x="97"  y="91" width="34" height="11" rx="2" fill="#20313e" stroke="#345266" stroke-width="0.5"/>
        <text x="114" y="98.5" fill="#cfe4f2" font-size="3.8" text-anchor="middle">FILES</text>
        <rect x="134" y="91" width="35" height="11" rx="2" fill="#20313e" stroke="#345266" stroke-width="0.5"/>
        <text x="151.5" y="98.5" fill="#cfe4f2" font-size="3.8" text-anchor="middle">SETUP</text>
    <text class="dimt" x="94.5" y="-2" font-size="3.2">7" DSI TOUCH · 1024x600 · 154x86 active</text>
  </g>

  <!-- control: dust (illuminated_button_22) -->
  <g>
    <circle cx="105" cy="260" r="11" fill="url(#btnW)" stroke="#5e666d" stroke-width="0.9"/>
    <text class="lbl" x="105" y="278">DUST</text>
    <text class="sub" x="105" y="282.5">RF · auto · lit = confirmed</text>
  </g>

  <!-- control: enable (deadman_22) -->
  <g>
    <circle cx="30" cy="182" r="12" fill="#3f464c" stroke="#20252a" stroke-width="1"/>
    <circle cx="30" cy="182" r="8" fill="#2b3136" stroke="#585f65" stroke-width="0.5"/>
    <text class="lbl" x="30" y="200">ENABLE</text>
    <text class="sub" x="30" y="204.5">hold to jog</text>
  </g>

  <!-- control: estop (estop_mushroom) -->
  <g>
    <rect x="252" y="12" width="76" height="76" rx="4" fill="#e8c11c" stroke="#8d7400" stroke-width="0.8"/>
    <circle cx="290" cy="47" r="25" fill="#2b2f33" opacity="0.25"/>
    <circle cx="290" cy="47" r="20" fill="url(#estop)" stroke="#6d0d06" stroke-width="1"/>
    <circle cx="290" cy="47" r="13" fill="none" stroke="#7d1109" stroke-width="0.6" opacity="0.7"/>
    <text x="290" y="49" fill="#ffe9e6" font-size="5" font-weight="700" text-anchor="middle">STOP</text>
    <text x="290" y="80" fill="#4a3d00" font-size="4.6" font-weight="700" text-anchor="middle">EMERGENCY STOP</text>
    <text x="290" y="85.5" fill="#6a5800" font-size="3" text-anchor="middle">PULL TO RELEASE · CUTS SPINDLE + STEPPERS</text>
  </g>

  <!-- control: feed_override (potentiometer) -->
  <g>
    <circle cx="93" cy="182" r="21" fill="none" stroke="#565d63" stroke-width="0.5"/>
    <circle cx="93" cy="182" r="15" fill="url(#knob)" stroke="#1e2226" stroke-width="0.9"/>
    <line x1="93" y1="182" x2="93" y2="169" class="tick" stroke-width="1.2"/>
    <g class="sub">
      <text x="72" y="196">0</text>
      <text x="76" y="170">50</text>
      <text x="93" y="160">100</text>
      <text x="111" y="170">150</text>
      <text x="115" y="196">200</text>
    </g>
    <text class="lbl" x="93" y="212">FEED OVERRIDE %</text>
  </g>

  <!-- control: hold (illuminated_button_22) -->
  <g>
    <circle cx="248" cy="128" r="11" fill="url(#btnY)" stroke="#7d5c00" stroke-width="0.9"/>
    <text class="lbl" x="248" y="146">HOLD</text>
    <text class="sub" x="248" y="150.5">feed hold</text>
  </g>

  <!-- control: lan (lan_passthrough) -->
  <g>
    <rect x="278" y="251" width="20" height="9" rx="1" fill="#12161a" stroke="#585f65" stroke-width="0.5"/>
    <text class="sub" x="288" y="266">LAN</text>
  </g>

  <!-- control: led_alarm (led_indicator) -->
  <g>
    <circle cx="128" cy="126" r="3" fill="#3a2f2f" stroke="#6b4a4a" stroke-width="0.4"/>
    <text class="sub" x="128" y="134">ALARM</text>
  </g>

  <!-- control: led_homed (led_indicator) -->
  <g>
    <circle cx="94" cy="126" r="3" fill="#4aa3ff"/>
    <text class="sub" x="94" y="134">HOMED</text>
  </g>

  <!-- control: led_link (led_indicator) -->
  <g>
    <circle cx="60" cy="126" r="3" fill="#35d07f"/>
    <text class="sub" x="60" y="134">LINK</text>
  </g>

  <!-- control: led_probe (led_indicator) -->
  <g>
    <circle cx="162" cy="126" r="3" fill="#3a3a2f" stroke="#6b664a" stroke-width="0.4"/>
    <text class="sub" x="162" y="134">PROBE</text>
  </g>

  <!-- control: led_pwr (led_indicator) -->
  <g>
    <circle cx="26" cy="126" r="3" fill="#35d07f"/>
    <text class="sub" x="26" y="134">PWR</text>
  </g>

  <!-- control: mpg (mpg_handwheel) -->
  <g>
    <g transform="translate(285,192) scale(0.94) translate(-283,-187)">
      <circle cx="283" cy="187" r="38" fill="#1e2226" opacity="0.5"/>
      <circle cx="283" cy="187" r="35" fill="url(#wheel)" stroke="#191d20" stroke-width="1.2"/>
      <circle cx="283" cy="187" r="26" fill="none" stroke="#20252a" stroke-width="0.8"/>
      <circle cx="283" cy="187" r="12" fill="#2b3136" stroke="#585f65" stroke-width="0.6"/>
      <g stroke="#20252a" stroke-width="0.55">
        <line x1="283" y1="152" x2="283" y2="161"/><line x1="283" y1="213" x2="283" y2="222"/>
        <line x1="248" y1="187" x2="257" y2="187"/><line x1="309" y1="187" x2="318" y2="187"/>
        <line x1="258" y1="162" x2="264" y2="168"/><line x1="302" y1="206" x2="308" y2="212"/>
        <line x1="308" y1="162" x2="302" y2="168"/><line x1="264" y1="206" x2="258" y2="212"/>
      </g>
      <circle cx="283" cy="163" r="4.6" fill="#12161a" stroke="#5c646a" stroke-width="0.5"/>
    </g>
    <text class="lbl" x="285" y="233">MPG HANDWHEEL</text>
  </g>

  <!-- control: reset (illuminated_button_22) -->
  <g>
    <circle cx="290" cy="128" r="11" fill="url(#btnR)" stroke="#6d130c" stroke-width="0.9"/>
    <text class="lbl" x="290" y="146">RESET</text>
    <text class="sub" x="290" y="150.5">soft reset / clear alarm</text>
  </g>

  <!-- control: spindle (illuminated_button_22) -->
  <g>
    <circle cx="40" cy="260" r="11" fill="url(#btnB)" stroke="#0d4370" stroke-width="0.9"/>
    <text class="lbl" x="40" y="278">SPINDLE</text>
    <text class="sub" x="40" y="282.5">M3/M5 · lit = running</text>
  </g>

  <!-- control: spindle_ovr (potentiometer) -->
  <g>
    <circle cx="180" cy="260" r="17" fill="none" stroke="#565d63" stroke-width="0.5"/>
    <circle cx="180" cy="260" r="12" fill="url(#knob)" stroke="#1e2226" stroke-width="0.9"/>
    <line x1="180" y1="260" x2="180" y2="250" class="tick" stroke-width="1.2"/>
    <g class="sub">
      <text x="163" y="252">50</text>
      <text x="180" y="241">100</text>
      <text x="198" y="252">150</text>
    </g>
    <text class="lbl" x="180" y="282">SPINDLE OVR %</text>
  </g>

  <!-- control: start (illuminated_button_22) -->
  <g>
    <circle cx="206" cy="128" r="11" fill="url(#btnG)" stroke="#0c5427" stroke-width="0.9"/>
    <text class="lbl" x="206" y="146">START</text>
    <text class="sub" x="206" y="150.5">cycle start / resume</text>
  </g>

  <!-- control: step_select (rotary_selector) -->
  <g>
    <circle cx="211" cy="182" r="21" fill="none" stroke="#565d63" stroke-width="0.5"/>
    <circle cx="211" cy="182" r="15" fill="url(#knob)" stroke="#1e2226" stroke-width="0.9"/>
    <line x1="211" y1="182" x2="211" y2="169" class="tick" stroke-width="1.2"/>
    <g class="sub">
      <text x="192" y="172">×1</text>
      <text x="211" y="159">×10</text>
      <text x="231" y="172">×100</text>
      <text x="211" y="203" fill="#6f787e">0.001 / 0.01 / 0.1 mm</text>
    </g>
    <text class="lbl" x="211" y="212">STEP</text>
  </g>

  <!-- control: usb (usb_passthrough) -->
  <g>
    <rect x="238" y="252" width="18" height="7" rx="1" fill="#12161a" stroke="#585f65" stroke-width="0.5"/>
    <text class="sub" x="247" y="266">USB</text>
  </g>

  <!-- ============ DIMENSIONS ============ -->
  <g class="dim">
    <line x1="0" y1="-8" x2="340" y2="-8"/>
    <line x1="0" y1="-11" x2="0" y2="-5"/><line x1="340" y1="-11" x2="340" y2="-5"/>
    <line x1="-8" y1="0" x2="-8" y2="290"/>
    <line x1="-11" y1="0" x2="-5" y2="0"/><line x1="-11" y1="290" x2="-5" y2="290"/>
  </g>
  <text class="dimt" x="170" y="-10">340 mm</text>
  <text class="dimt" x="-8" y="145" transform="rotate(-90,-8,145)">290 mm</text>
  <text class="dimt" x="290" y="-2" font-size="3.2">Ø40 mushroom / Ø22 mount</text>
  <text class="dimt" x="283" y="300" font-size="3.2">Ø76 · 100 PPR quadrature</text>
  <text class="dimt" x="120" y="300" font-size="3.2">Ø22 illuminated momentary ×5</text>
</svg>
