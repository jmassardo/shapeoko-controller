# =============================================================================
# Shapeoko controller — Samba configuration TEMPLATE
# =============================================================================
# This is a TEMPLATE, not a ready-to-use smb.conf. deploy/samba/install.sh
# substitutes the __PLACEHOLDER__ tokens below and validates the result with
# `testparm -s` before installing it to /etc/samba/smb.conf.
#
# Purpose: expose a single LAN-only, password-protected share ("shapeoko")
# into which the owner pushes .nc g-code files from a workstation on the shop
# LAN. This share is the ingest path for files that drive a machine with a
# spinning cutter, so the posture here is deliberately restrictive:
#
#   * SMB1 is disabled (SMB2.1 minimum, negotiates up to SMB3).
#   * Guest / anonymous access is refused outright.
#   * The service binds only to the loopback + the configured LAN interface.
#   * Application-layer host allow/deny further constrains to private ranges.
#   * Files/dirs are created with restrictive modes and a single owner.
#
# Placeholders (filled in by install.sh):
#   __SMB_USER__        unix + samba account that owns the share
#   __SMB_INTERFACES__  space-separated interface name(s) or CIDR(s), e.g. "eth0"
#   __SMB_HOSTS_ALLOW__ space-separated allow list, e.g. "192.168.0.0/16"
# =============================================================================

[global]
   workgroup = WORKGROUP
   server string = Shapeoko g-code ingest
   server role = standalone server

   # --- Protocol hardening: refuse SMB1/CIFS entirely -----------------------
   # SMB2_10 == SMB 2.1 (Windows 7 era); clients negotiate up to SMB3.
   server min protocol = SMB2_10
   client min protocol = SMB2_10
   # Never fall back to the legacy/insecure SMB1 dialect.
   server max protocol = SMB3

   # --- No guests, no anonymous ---------------------------------------------
   map to guest = never
   guest account = nobody
   restrict anonymous = 2

   # --- LAN-only network binding --------------------------------------------
   # bind interfaces only = yes means smbd/nmbd ONLY listen on the interfaces
   # listed below. The loopback is required for local tooling (testparm etc).
   bind interfaces only = yes
   interfaces = lo 127.0.0.1/8 __SMB_INTERFACES__

   # --- Defense in depth: application-layer host filtering ------------------
   # allow takes precedence over deny, so this pins access to the LAN even if
   # the interface binding is ever misconfigured. hosts deny = ALL is the
   # fail-closed default.
   hosts allow = 127.0.0.1 __SMB_HOSTS_ALLOW__
   hosts deny = 0.0.0.0/0

   # --- Restrictive default file/dir creation modes -------------------------
   create mask = 0640
   directory mask = 0750
   force create mode = 0640
   force directory mode = 0750

   # --- Logging --------------------------------------------------------------
   log file = /var/log/samba/log.%m
   max log size = 1000
   log level = 1

   # --- No printing services (this is a file ingest box) --------------------
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   show add printer wizard = no

# -----------------------------------------------------------------------------
# The one and only share. Single authenticated writer.
# -----------------------------------------------------------------------------
[shapeoko]
   comment = Shapeoko .nc g-code ingest (LAN only)
   path = /srv/gcode
   browseable = yes
   read only = no
   writable = yes

   # Only the provisioned owner account may touch the share.
   guest ok = no
   valid users = __SMB_USER__
   write list = __SMB_USER__
   # Everything lands owned by the single owner account with restrictive modes,
   # regardless of the client's identity mapping.
   force user = __SMB_USER__
   create mask = 0640
   force create mode = 0640
   directory mask = 0750
   force directory mode = 0750
