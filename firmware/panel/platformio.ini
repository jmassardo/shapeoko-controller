; SPDX-License-Identifier: MIT
;
; PlatformIO project configuration — Shapeoko Pro XXL operator-panel firmware
; (issue #53 scaffold).
;
; Two environments, one codebase:
;   * esp32dev — the real target build for the panel MCU (ESP32-WROOM), using
;                the Arduino framework.
;   * native   — a host build that runs the Unity smoke test on the CI runner
;                with NO ESP32 attached, exercising pure logic through the HAL
;                seam (include/hal.h).
;
; Framework choice: Arduino (not ESP-IDF). No prior firmware has standardised
; ESP-IDF in this repo, and Arduino keeps this one-day scaffold small while
; still exposing the timers, GPIO, USB serial, and watchdog the panel needs.
; The HAL boundary keeps drivers framework-agnostic, so a later move to ESP-IDF
; would not touch driver logic. See firmware/panel/README.md for the rationale.
;
; Warnings-as-errors: -Wall -Wextra -Werror is applied to OUR sources and tests
; in every environment, so any warning fails the build/test (acceptance
; criterion). It is scoped to project/test code (build_src_flags / per-env
; build_flags) rather than framework/library code, which we do not own.
;
; This is a separate toolchain from the Node workspaces and is intentionally
; NOT coupled to them (no npm workspace membership, no npm-driven pio calls).
; CI (#14) wires the two as independent jobs.

[platformio]
default_envs = esp32dev

; Flags applied only to files WE own (src/). Framework/library code keeps its
; own flags, so third-party warnings cannot break our build.
[env]
build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
; The native env builds and runs the Unity test in test/. Apply warnings-as-
; errors to the test build too (build_src_flags only covers src/, which the
; test build excludes via the default test_build_src = no).
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
