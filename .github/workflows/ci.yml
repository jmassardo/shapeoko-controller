# GitHub Actions CI for the Shapeoko controller (issue #14).
#
# Two independent jobs so a failure in either fails the PR:
#   * node     — lint, format, typecheck, unit tests + coverage, build, the
#                GPL-3.0 header scan (#11), and the engines/matrix coherence
#                guard. Pinned to Node 26.x (the project's target major).
#   * firmware — the PlatformIO panel build + native Unity tests (#53), kept
#                deliberately separate from the Node toolchain.
name: CI

on:
  push:
  pull_request:

# Cancel a superseded in-progress run for the same ref so pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 26.x is the project target (see root package.json engines.node
        # ">=26.5.0 <27.0.0"). The check:engines-matrix step below fails if this
        # matrix and that range ever drift apart.
        node-version: ['26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Install dependencies (npm ci, engine-strict enforced)
        run: npm ci

      # npm 11 skips esbuild/fsevents postinstall scripts by default. Verify
      # explicitly that this is harmless here rather than assuming it (AC): the
      # platform binaries ship via optionalDependencies, so esbuild still runs.
      - name: Verify skipped postinstall scripts are harmless (npm 11)
        run: |
          echo "ignore-scripts is: $(npm config get ignore-scripts)"
          npm ls esbuild || true
          npx esbuild --version

      - name: Engines / CI-matrix coherence guard
        run: npm run check:engines-matrix

      - name: Tooling unit tests (engines/matrix assertion)
        run: node --test 'tools/**/*.test.mjs'

      - name: GPL-3.0 header / SPDX policy scan (#11)
        run: node tools/check-no-gpl3-headers.mjs

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  firmware:
    name: Firmware (PlatformIO panel build + native tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache PlatformIO core and toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/panel/platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build panel firmware (esp32dev)
        run: pio run -d firmware/panel

      - name: Run native Unity tests
        run: pio test -d firmware/panel -e native
